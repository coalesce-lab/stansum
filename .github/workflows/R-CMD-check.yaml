# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, instantiate]
  pull_request:
    branches: [main, master, instantiate]
  workflow_dispatch:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'release'}
          # - {os: ubuntu-latest,   r: 'oldrel-1'}
          # - {os: macos-latest,   r: 'release'}
          # - {os: windows-latest, r: 'release'}
          # - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # The -Wno-* flags below come from CmdStan's makefiles when the Stan
      # models are compiled at install time (src/install.libs.R), not from
      # this package (src/Makevars is empty). `--as-cran` forces
      # _R_CHECK_COMPILATION_FLAGS_=TRUE, so the check cannot be disabled;
      # instead whitelist the flags CmdStan injects on Linux/gcc.
      _R_CHECK_COMPILATION_FLAGS_KNOWN_: >-
        -Wno-class-memaccess
        -Wno-deprecated-declarations
        -Wno-ignored-attributes
        -Wno-sign-compare

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          extra-repositories: 'https://mc-stan.org/r-packages/'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install CmdStan
        shell: Rscript {0}
        run: |
          install.packages("cmdstanr", repos = c("https://mc-stan.org/r-packages/", getOption("repos")))
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
          cmdstanr::install_cmdstan()

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
